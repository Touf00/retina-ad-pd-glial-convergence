name: ChatGPT GSE157827 supplement structure audit

on:
  push:
    branches: [chatgpt-repro-audit]
    paths:
      - ".github/workflows/chatgpt-gse157827-supp-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas openpyxl requests
      - name: Inspect official supplementary workbooks
        run: |
          python - <<'PY'
          import requests,pandas as pd,json,hashlib
          from pathlib import Path
          out=Path("/tmp/gse157827_supp"); out.mkdir(exist_ok=True)
          base="https://pmc-oa-opendata.s3.amazonaws.com/PMC7568283.1/"
          report={}
          for n in range(1,6):
              fn=f"pnas.2008762117.sd0{n}.xlsx"
              u=base+fn
              r=requests.get(u,timeout=(20,120)); r.raise_for_status()
              p=out/fn; p.write_bytes(r.content)
              xls=pd.ExcelFile(p)
              rec={"bytes":len(r.content),"sha256":hashlib.sha256(r.content).hexdigest(),"sheets":[]}
              for sh in xls.sheet_names:
                  df=pd.read_excel(p,sheet_name=sh,nrows=12,dtype=object)
                  rec["sheets"].append({
                    "sheet":sh,
                    "columns":[str(c) for c in df.columns],
                    "preview":df.astype(str).head(8).to_dict("records")
                  })
              report[fn]=rec
          (out/"supplement_structure.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2)[:60000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gse157827-supplement-structure
          path: /tmp/gse157827_supp/
          retention-days: 7
