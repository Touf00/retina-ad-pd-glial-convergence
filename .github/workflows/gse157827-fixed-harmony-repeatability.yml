name: GSE157827 fixed-Harmony downstream repeatability

on:
  push:
    branches: [reproducibility-audit]
    paths:
      - ".github/workflows/gse157827-fixed-harmony-repeatability.yml"

permissions:
  contents: read
  actions: read

jobs:
  fixed-harmony-replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install clustering environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 \
            scipy==1.16.3 \
            pandas==2.3.3 \
            anndata==0.13.3.post0 \
            scanpy==1.12.4 \
            scikit-learn==1.6.1 \
            pynndescent==0.6.0 \
            umap-learn==0.5.12 \
            numba==0.67.0 \
            llvmlite==0.49.0 \
            leidenalg==0.12.0 \
            igraph==1.0.0 \
            threadpoolctl==3.7.0

      - name: Download frozen Harmony checkpoint
        uses: actions/download-artifact@v5
        with:
          name: retina-nd-clean-room-audit
          path: /tmp/frozen
          run-id: 36144781563
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify frozen input and rerun only neighbors plus Leiden
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, platform
          import numpy as np
          import pandas as pd
          import scipy.sparse as sp
          import anndata as ad
          import scanpy as sc
          from threadpoolctl import threadpool_info

          SEED=20260914
          hpath=Path("/tmp/frozen/GSE157827_STEP26A1_HARMONY20_v1.npy")
          if not hpath.exists():
              hits=list(Path("/tmp/frozen").rglob("GSE157827_STEP26A1_HARMONY20_v1.npy"))
              if len(hits)!=1:
                  raise RuntimeError(f"Expected one frozen Harmony file, found {hits}")
              hpath=hits[0]

          def file_sha(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for block in iter(lambda:f.read(4*1024*1024),b""):
                      h.update(block)
              return h.hexdigest()

          H=np.load(hpath)
          assert H.shape==(169506,20), H.shape
          frozen_sha=file_sha(hpath)

          a=ad.AnnData(X=sp.csr_matrix((H.shape[0],1),dtype=np.float32))
          a.obsm["X_harmony20"]=np.asarray(H,dtype=np.float32)

          sc.pp.neighbors(
              a,
              n_neighbors=20,
              use_rep="X_harmony20",
              metric="euclidean",
              random_state=SEED,
          )

          def sparse_sha(x):
              x=x.tocsr()
              h=hashlib.sha256()
              for arr in (x.indptr,x.indices,x.data):
                  h.update(np.ascontiguousarray(arr).view(np.uint8))
              return h.hexdigest()

          conn_sha=sparse_sha(a.obsp["connectivities"])
          dist_sha=sparse_sha(a.obsp["distances"])

          sc.tl.leiden(
              a,
              resolution=1.0,
              random_state=SEED,
              key_added="cluster",
              flavor="igraph",
              n_iterations=2,
              directed=False,
          )

          labels=a.obs["cluster"].astype(str).tolist()
          canon_map={}
          canon=[]
          for label in labels:
              if label not in canon_map:
                  canon_map[label]=len(canon_map)
              canon.append(str(canon_map[label]))
          partition_sha=hashlib.sha256(("\n".join(canon)+"\n").encode()).hexdigest()

          result={
              "replicate":int("${{ matrix.replicate }}"),
              "python":platform.python_version(),
              "n_cells":int(H.shape[0]),
              "frozen_harmony20_sha256":frozen_sha,
              "connectivities_sha256":conn_sha,
              "distances_sha256":dist_sha,
              "n_clusters":int(a.obs["cluster"].nunique()),
              "partition_sha256":partition_sha,
              "cluster_sizes":sorted(a.obs["cluster"].value_counts().astype(int).tolist(),reverse=True),
              "thread_env":{k:os.environ.get(k) for k in [
                  "OMP_NUM_THREADS","OPENBLAS_NUM_THREADS","MKL_NUM_THREADS",
                  "NUMEXPR_NUM_THREADS","BLIS_NUM_THREADS","VECLIB_MAXIMUM_THREADS",
                  "NUMBA_NUM_THREADS"
              ]},
              "threadpools":threadpool_info(),
          }
          print("FIXED_HARMONY_RESULT",json.dumps(result,indent=2))
          Path("/tmp/fixed_harmony_result.json").write_text(json.dumps(result,indent=2))
          PY

      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: gse157827-fixed-harmony-result-${{ matrix.replicate }}
          path: /tmp/fixed_harmony_result.json
          retention-days: 7
