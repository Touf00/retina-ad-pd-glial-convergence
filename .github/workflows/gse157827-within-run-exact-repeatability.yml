name: GSE157827 within-run exact-neighbor repeatability

on:
  push:
    branches: [reproducibility-audit]
    paths:
      - ".github/workflows/gse157827-within-run-exact-repeatability.yml"

permissions:
  contents: read
  actions: read

jobs:
  within-run-repeatability:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install clustering environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 scipy==1.16.3 pandas==2.3.3 \
            anndata==0.13.3.post0 scanpy==1.12.4 scikit-learn==1.6.1 \
            numba==0.67.0 llvmlite==0.49.0 leidenalg==0.12.0 igraph==1.0.0 \
            threadpoolctl==3.7.0

      - name: Download frozen Harmony checkpoint
        uses: actions/download-artifact@v5
        with:
          name: retina-nd-clean-room-audit
          path: /tmp/frozen
          run-id: 36144781563
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run exact calculation twice in the same process
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, platform, subprocess
          import numpy as np
          import scipy.sparse as sp
          import anndata as ad
          import scanpy as sc
          import sklearn
          from sklearn.neighbors import KNeighborsTransformer
          from threadpoolctl import threadpool_info

          SEED=20260914
          hits=list(Path("/tmp/frozen").rglob("GSE157827_STEP26A1_HARMONY20_v1.npy"))
          if len(hits)!=1:
              raise RuntimeError(f"Expected one frozen Harmony file, found {hits}")
          hpath=hits[0]
          H=np.load(hpath)
          assert H.shape==(169506,20), H.shape
          H=np.asarray(H,dtype=np.float32)

          def sparse_sha(x):
              x=x.tocsr()
              h=hashlib.sha256()
              for arr in (x.indptr,x.indices,x.data):
                  h.update(np.ascontiguousarray(arr).view(np.uint8))
              return h.hexdigest()

          def one():
              a=ad.AnnData(X=sp.csr_matrix((H.shape[0],1),dtype=np.float32))
              a.obsm["X_harmony20"]=H.copy()
              transformer=KNeighborsTransformer(
                  n_neighbors=20, mode="distance", metric="euclidean",
                  algorithm="brute", n_jobs=1,
              )
              sc.pp.neighbors(a,use_rep="X_harmony20",method="umap",transformer=transformer)
              dsha=sparse_sha(a.obsp["distances"])
              csha=sparse_sha(a.obsp["connectivities"])
              sc.tl.leiden(
                  a,resolution=1.0,random_state=SEED,key_added="cluster",
                  flavor="igraph",n_iterations=2,directed=False,
              )
              labels=a.obs["cluster"].astype(str).tolist()
              cmap={}; canon=[]
              for label in labels:
                  if label not in cmap: cmap[label]=len(cmap)
                  canon.append(str(cmap[label]))
              psha=hashlib.sha256(("\n".join(canon)+"\n").encode()).hexdigest()
              return {
                  "distances_sha256":dsha,
                  "connectivities_sha256":csha,
                  "n_clusters":int(a.obs["cluster"].nunique()),
                  "partition_sha256":psha,
                  "cluster_sizes":sorted(a.obs["cluster"].value_counts().astype(int).tolist(),reverse=True),
              }

          r1=one()
          r2=one()
          try:
              cpu=subprocess.check_output(["bash","-lc","lscpu"],text=True)
          except Exception as e:
              cpu=str(e)
          result={
              "python":platform.python_version(),
              "numpy":np.__version__,
              "sklearn":sklearn.__version__,
              "threadpools":threadpool_info(),
              "cpu":cpu,
              "repeat_1":r1,
              "repeat_2":r2,
              "distance_hash_match":r1["distances_sha256"]==r2["distances_sha256"],
              "connectivity_hash_match":r1["connectivities_sha256"]==r2["connectivities_sha256"],
              "partition_hash_match":r1["partition_sha256"]==r2["partition_sha256"],
          }
          print("WITHIN_RUN_EXACT_RESULT",json.dumps(result,indent=2))
          Path("/tmp/result.json").write_text(json.dumps(result,indent=2))
          PY

      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: gse157827-within-run-exact-result
          path: /tmp/result.json
          retention-days: 7
