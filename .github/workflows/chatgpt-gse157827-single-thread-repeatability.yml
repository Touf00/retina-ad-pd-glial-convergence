name: ChatGPT GSE157827 single-thread repeatability audit

on:
  push:
    branches: [chatgpt-repro-audit]
    paths:
      - ".github/workflows/chatgpt-gse157827-single-thread-repeatability.yml"

permissions:
  contents: read

jobs:
  single-thread-replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2]
    env:
      RETINA_ND_ROOT: /tmp/retina_drive/MyDrive/RETINA_ND_RELEASE_TEST
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install exact historical-like STEP26A1 environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 \
            pandas==2.3.3 \
            scipy==1.16.3 \
            anndata==0.13.3.post0 \
            scanpy==1.12.4 \
            scikit-learn==1.6.1 \
            scikit-misc==0.5.2 \
            harmonypy==2.0.0 \
            leidenalg==0.12.0 \
            igraph==1.0.0 \
            requests openpyxl h5py pypdf matplotlib gseapy nbconvert jupyter

      - name: Build focused original STEP26A1 notebook
        run: |
          mkdir -p "$RETINA_ND_ROOT/locks"
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("/tmp/retina_drive/MyDrive/RETINA_ND_RELEASE_TEST")
          locks=root/"locks"
          (locks/"AD_BRAIN_DATASET_ROLES_v1.json").write_text(json.dumps({
            "status":"AD_DATASET_ROLES_FROZEN_BEFORE_DISEASE_EXPRESSION",
            "primary_replication":{"dataset":"GSE157827"},
            "primary_discovery":{"dataset":"GSE174367"}
          },indent=2))
          (locks/"GSE174367_AD_DISCOVERY_FINAL_ROBUSTNESS_FREEZE_v1.json").write_text(json.dumps({
            "status":"AD_DISCOVERY_FINAL_ROBUSTNESS_FROZEN",
            "AD_replication_performed":False,
            "AD_PD_convergence_performed":False
          },indent=2))

          nb=json.loads(Path("RETINA_ND_bioRxiv_release.ipynb").read_text())
          markers=[
            "STEP 24 — GSE157827 AD REPLICATION RAW-DATA AUDIT",
            "STEP 24C — COMPLETE GSE157827 RAW REPLICATION AUDIT",
            "STEP 25 — GSE157827 REPLICATION DONOR METADATA",
            "RETINA-ND — STEP 26A1",
          ]
          cells=[]
          for marker in markers:
              hits=[c for c in nb["cells"] if marker in "".join(c.get("source",[]))]
              if len(hits)!=1:
                  raise RuntimeError(f"{marker}: got {len(hits)}")
              cell=dict(hits[0])
              src="".join(cell["source"]).replace("/content/drive/MyDrive/RETINA_ND_V2",str(root))
              cell["source"]=src.splitlines(keepends=True)
              cell["outputs"]=[]
              cell["execution_count"]=None
              cells.append(cell)

          mini={
            "cells":cells,
            "metadata":nb.get("metadata",{}),
            "nbformat":nb["nbformat"],
            "nbformat_minor":nb["nbformat_minor"],
          }
          Path("/tmp/GSE157827_SINGLE_THREAD.ipynb").write_text(json.dumps(mini))
          print("MINI_CELLS",len(cells))
          PY

      - name: Execute through STEP26A1 with one numerical thread
        run: |
          set -o pipefail
          jupyter nbconvert \
            --to notebook \
            --execute /tmp/GSE157827_SINGLE_THREAD.ipynb \
            --output /tmp/GSE157827_SINGLE_THREAD_EXECUTED.ipynb \
            --ExecutePreprocessor.timeout=5400

      - name: Extract aggregate result and hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import importlib.metadata as im
          import json
          import os
          import platform

          import pandas as pd
          from threadpoolctl import threadpool_info

          analysis_root=Path("/tmp/retina_drive/MyDrive/RETINA_ND_RELEASE_TEST")
          annotation_root=analysis_root/"GSE157827_AD_replication"/"annotation_provisional"
          obs_path=annotation_root/"GSE157827_STEP26A1_OBS_CLUSTER_ASSIGNMENTS_v1.csv.gz"
          hvg_path=annotation_root/"GSE157827_DISEASE_BLIND_HVG1000_v1.csv"
          harmony_path=annotation_root/"GSE157827_STEP26A1_HARMONY20_v1.npy"
          lock_path=analysis_root/"locks"/"GSE157827_AD_REPLICATION_STEP26A1_DISEASE_BLIND_CLUSTERING_v1.json"

          def sha256(path):
              h=hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda:handle.read(4*1024*1024),b""):
                      h.update(block)
              return h.hexdigest()

          obs=pd.read_csv(obs_path,usecols=["cluster"])
          lock=json.loads(lock_path.read_text())
          labels=obs["cluster"].astype(str).tolist()
          canonical_map={}
          canonical=[]
          for label in labels:
              if label not in canonical_map:
                  canonical_map[label]=len(canonical_map)
              canonical.append(str(canonical_map[label]))
          partition_sha256=hashlib.sha256(("\n".join(canonical)+"\n").encode()).hexdigest()
          cluster_size_signature=sorted(obs["cluster"].value_counts().astype(int).tolist(),reverse=True)
          packages=[
            "numpy","pandas","scipy","anndata","scanpy","scikit-learn",
            "scikit-misc","harmonypy","leidenalg","igraph","numba",
            "llvmlite","pynndescent","umap-learn","joblib","threadpoolctl",
          ]
          result={
            "replicate":int("${{ matrix.replicate }}"),
            "python":platform.python_version(),
            "packages":{name:im.version(name) for name in packages},
            "thread_env":{name:os.environ.get(name) for name in [
              "OMP_NUM_THREADS","OPENBLAS_NUM_THREADS","MKL_NUM_THREADS",
              "NUMEXPR_NUM_THREADS","BLIS_NUM_THREADS","VECLIB_MAXIMUM_THREADS",
              "NUMBA_NUM_THREADS",
            ]},
            "threadpools":threadpool_info(),
            "n_cells":int(len(obs)),
            "n_clusters":int(obs["cluster"].astype(str).nunique()),
            "hvg_span":lock["embedding"]["HVG_LOESS_span_used"],
            "restored_archival_28":int(obs["cluster"].astype(str).nunique())==28,
            "label_invariant_partition_sha256":partition_sha256,
            "cluster_size_signature":cluster_size_signature,
            "hvg_sha256":sha256(hvg_path),
            "harmony20_sha256":sha256(harmony_path),
            "lock_sha256":sha256(lock_path),
          }
          print("SINGLE_THREAD_RESULT",json.dumps(result,indent=2))
          Path("/tmp/single_thread_result.json").write_text(json.dumps(result,indent=2))
          PY

      - name: Collect privacy-minimized audit
        if: always()
        run: |
          mkdir -p /tmp/single_thread_audit
          cp /tmp/single_thread_result.json /tmp/single_thread_audit/ 2>/dev/null || true
          cp "/tmp/retina_drive/MyDrive/RETINA_ND_RELEASE_TEST/locks/GSE157827_AD_REPLICATION_STEP26A1_DISEASE_BLIND_CLUSTERING_v1.json" /tmp/single_thread_audit/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gse157827-single-thread-replicate-${{ matrix.replicate }}
          path: /tmp/single_thread_audit
          retention-days: 7

