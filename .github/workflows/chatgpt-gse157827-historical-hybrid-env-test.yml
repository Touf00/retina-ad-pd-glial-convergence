name: ChatGPT GSE157827 historical-hybrid environment test

on:
  push:
    branches: [chatgpt-repro-audit]
    paths:
      - ".github/workflows/chatgpt-gse157827-historical-hybrid-env-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RETINA_ND_ROOT: /tmp/retina_drive/MyDrive/RETINA_ND_RELEASE_TEST

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install likely historical STEP26A1 environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install             numpy==2.1.3             pandas==2.2.3             scipy==1.16.3             anndata==0.12.6             scanpy==1.12.4             scikit-learn==1.6.1             scikit-misc==0.5.2             harmonypy==2.0.0             leidenalg==0.12.0             igraph==1.0.0             requests openpyxl h5py pypdf matplotlib gseapy nbconvert jupyter
          python - <<'PY'
          import platform, importlib.metadata as im
          for p in ["numpy","pandas","scipy","anndata","scanpy","scikit-learn","scikit-misc","harmonypy","leidenalg","igraph"]:
              print("ENV",p,im.version(p))
          print("PYTHON",platform.python_version())
          PY

      - name: Build focused original STEP26A1 notebook
        run: |
          mkdir -p "$RETINA_ND_ROOT/locks"
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("/tmp/retina_drive/MyDrive/RETINA_ND_RELEASE_TEST")
          locks=root/"locks"
          (locks/"AD_BRAIN_DATASET_ROLES_v1.json").write_text(json.dumps({
            "status":"AD_DATASET_ROLES_FROZEN_BEFORE_DISEASE_EXPRESSION",
            "primary_replication":{"dataset":"GSE157827"},
            "primary_discovery":{"dataset":"GSE174367"}
          },indent=2))
          (locks/"GSE174367_AD_DISCOVERY_FINAL_ROBUSTNESS_FREEZE_v1.json").write_text(json.dumps({
            "status":"AD_DISCOVERY_FINAL_ROBUSTNESS_FROZEN",
            "AD_replication_performed":False,
            "AD_PD_convergence_performed":False
          },indent=2))

          nb=json.loads(Path("RETINA_ND_bioRxiv_release.ipynb").read_text())
          markers=[
            "STEP 24 — GSE157827 AD REPLICATION RAW-DATA AUDIT",
            "STEP 24C — COMPLETE GSE157827 RAW REPLICATION AUDIT",
            "STEP 25 — GSE157827 REPLICATION DONOR METADATA",
            "RETINA-ND — STEP 26A1",
          ]
          cells=[]
          for marker in markers:
              hits=[c for c in nb["cells"] if marker in "".join(c.get("source",[]))]
              if len(hits)!=1: raise RuntimeError(f"{marker}: got {len(hits)}")
              cell=dict(hits[0])
              src="".join(cell["source"]).replace("/content/drive/MyDrive/RETINA_ND_V2",str(root))
              cell["source"]=src.splitlines(keepends=True)
              cell["outputs"]=[]
              cell["execution_count"]=None
              cells.append(cell)

          mini={"cells":cells,"metadata":nb.get("metadata",{}),"nbformat":nb["nbformat"],"nbformat_minor":nb["nbformat_minor"]}
          Path("/tmp/GSE157827_HISTORICAL_HYBRID.ipynb").write_text(json.dumps(mini))
          print("MINI_CELLS",len(cells))
          PY

      - name: Execute through STEP26A1
        run: |
          set -o pipefail
          jupyter nbconvert             --to notebook             --execute /tmp/GSE157827_HISTORICAL_HYBRID.ipynb             --output /tmp/GSE157827_HISTORICAL_HYBRID_EXECUTED.ipynb             --ExecutePreprocessor.timeout=5400             2>&1 | tee /tmp/historical_hybrid.log

      - name: Extract result
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, pandas as pd, importlib.metadata as im, platform
          root=Path("/tmp/retina_drive/MyDrive/RETINA_ND_RELEASE_TEST/GSE157827_AD_replication/annotation_provisional")
          obs=pd.read_csv(root/"GSE157827_STEP26A1_OBS_CLUSTER_ASSIGNMENTS_v1.csv.gz")
          lock=json.loads((root/"GSE157827_AD_REPLICATION_STEP26A1_DISEASE_BLIND_CLUSTERING_v1.json").read_text())
          result={
            "python":platform.python_version(),
            "numpy":im.version("numpy"),
            "pandas":im.version("pandas"),
            "scipy":im.version("scipy"),
            "anndata":im.version("anndata"),
            "scanpy":im.version("scanpy"),
            "scikit_learn":im.version("scikit-learn"),
            "harmonypy":im.version("harmonypy"),
            "n_clusters":int(obs["cluster"].astype(str).nunique()),
            "hvg_span":lock["embedding"]["HVG_LOESS_span_used"],
            "restored_archival_28":int(obs["cluster"].astype(str).nunique())==28,
          }
          print("HISTORICAL_HYBRID_RESULT",json.dumps(result,indent=2))
          Path("/tmp/historical_hybrid_result.json").write_text(json.dumps(result,indent=2))
          PY

      - name: Collect
        if: always()
        run: |
          mkdir -p /tmp/historical_hybrid_audit
          cp /tmp/historical_hybrid.log /tmp/historical_hybrid_audit/ 2>/dev/null || true
          cp /tmp/historical_hybrid_result.json /tmp/historical_hybrid_audit/ 2>/dev/null || true
          ROOT="/tmp/retina_drive/MyDrive/RETINA_ND_RELEASE_TEST/GSE157827_AD_replication/annotation_provisional"
          cp "$ROOT/GSE157827_DISEASE_BLIND_HVG1000_v1.csv" /tmp/historical_hybrid_audit/ 2>/dev/null || true
          cp "$ROOT/GSE157827_STEP26A1_OBS_CLUSTER_ASSIGNMENTS_v1.csv.gz" /tmp/historical_hybrid_audit/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gse157827-historical-hybrid-env-test
          path: /tmp/historical_hybrid_audit
          retention-days: 7
