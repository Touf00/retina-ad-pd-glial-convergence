name: GSE157827 donor-effect clustering robustness

on:
  push:
    branches: [reproducibility-audit]
    paths:
      - ".github/workflows/gse157827-donor-effect-clustering-robustness.yml"

permissions:
  contents: read
  actions: read

jobs:
  donor-effect-robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install analysis environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 pandas==2.3.3 scipy==1.16.3 \
            anndata==0.13.3.post0 scanpy==1.12.4 scikit-learn==1.6.1 \
            scikit-misc==0.5.2 harmonypy==2.0.0 leidenalg==0.12.0 igraph==1.0.0 \
            pydeseq2==0.5.4 requests openpyxl h5py pypdf matplotlib gseapy nbconvert jupyter

      - name: Download frozen AD discovery effects
        uses: actions/download-artifact@v5
        with:
          name: retina-nd-clean-room-audit
          path: /tmp/reference
          run-id: 36144781563
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build matched default and exact-neighbor notebooks
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          source=Path("RETINA_ND_bioRxiv_release.ipynb")
          nb=json.loads(source.read_text())
          markers=[
              "STEP 24 — GSE157827 AD REPLICATION RAW-DATA AUDIT",
              "STEP 24C — COMPLETE GSE157827 RAW REPLICATION AUDIT",
              "STEP 25 — GSE157827 REPLICATION DONOR METADATA",
              "RETINA-ND — STEP 26A1",
              "RETINA-ND — STEP 26A2",
              "RETINA-ND — STEP 26B",
              "RETINA-ND — STEP 27 — CORRECTED",
              "V2 STEP 28 — GSE157827 PRIMARY + PMD REPLICATION DE",
          ]

          def diagnostic_patch_26b(src):
              old='''assert len(
              cluster_table
          ) == 28'''
              if old not in src:
                  raise RuntimeError("STEP26B cluster-count assertion not found")
              src=src.replace(old,'print("SENSITIVITY_CLUSTER_COUNT", len(cluster_table), "ARCHIVAL_EXPECTED", 28)',1)

              old='''assert int(
              cluster_table[
                  "low_margin_lt_0.5"
              ].sum()
          ) == 6'''
              if old not in src:
                  raise RuntimeError("STEP26B low-margin assertion not found")
              src=src.replace(old,'print("SENSITIVITY_LOW_MARGIN_COUNT", int(cluster_table["low_margin_lt_0.5"].sum()), "ARCHIVAL_EXPECTED", 6)',1)

              needle='    assert observed == expected_clusters, ('
              if needle not in src:
                  raise RuntimeError("STEP26B cluster-map assertion not found")
              src=src.replace(
                  needle,
                  '    if observed != expected_clusters:\n'
                  '        print("SENSITIVITY_CLUSTER_MAP_CHANGED", cell_type, "observed", sorted(observed), "archival", sorted(expected_clusters))\n'
                  '    assert True, (',
                  1,
              )

              old='''assert (
              final_counts.to_dict()
              ==
              EXPECTED_COUNTS
          )'''
              if old not in src:
                  raise RuntimeError("STEP26B final-count assertion not found")
              src=src.replace(
                  old,
                  'print("SENSITIVITY_FINAL_COUNTS", final_counts.to_dict(), "ARCHIVAL_EXPECTED", EXPECTED_COUNTS)',
                  1,
              )

              saved_old='''assert (
              saved_final_cells[
                  "final_target_celltype"
              ]
              .value_counts()
              .reindex(
                  TARGET_ORDER,
                  fill_value=0,
              )
              .to_dict()
              ==
              EXPECTED_COUNTS
          )'''
              if saved_old not in src:
                  raise RuntimeError("STEP26B saved final-count assertion not found")
              src=src.replace(
                  saved_old,
                  'print("SENSITIVITY_SAVED_FINAL_COUNTS", saved_final_cells["final_target_celltype"].value_counts().reindex(TARGET_ORDER, fill_value=0).to_dict(), "ARCHIVAL_EXPECTED", EXPECTED_COUNTS)',
                  1,
              )
              return src

          def patch_step27(src):
              start=src.index("EXPECTED_SENS20 = {")
              pos=src.index("\n\nfor cell_type in TARGET_CLASSES:", start)
              diagnostic=chr(10).join([
                  "",
                  'ARCHIVAL_EXPECTED_PRIMARY = dict(EXPECTED_PRIMARY)',
                  'ARCHIVAL_EXPECTED_SENS20 = dict(EXPECTED_SENS20)',
                  'OBSERVED_PRIMARY = {str(r.cell_type):(int(r.primary_donors),int(r.primary_AD),int(r.primary_Control)) for _,r in eligibility_summary.iterrows()}',
                  'OBSERVED_SENS20 = {str(r.cell_type):(int(r.sensitivity_donors),int(r.sensitivity_AD),int(r.sensitivity_Control)) for _,r in eligibility_summary.iterrows()}',
                  'print("SENSITIVITY_ELIGIBILITY_PRIMARY", OBSERVED_PRIMARY, "ARCHIVAL_EXPECTED", ARCHIVAL_EXPECTED_PRIMARY)',
                  'print("SENSITIVITY_ELIGIBILITY_SENS20", OBSERVED_SENS20, "ARCHIVAL_EXPECTED", ARCHIVAL_EXPECTED_SENS20)',
                  'EXPECTED_PRIMARY = dict(OBSERVED_PRIMARY)',
                  'EXPECTED_SENS20 = dict(OBSERVED_SENS20)',
                  "",
              ])
              src=src[:pos]+diagnostic+src[pos:]

              dstart=src.index("EXPECTED_PRIMARY_DESIGN = {")
              dpos=src.index("\n\nfor cell_type in TARGET_CLASSES:", dstart)
              design_diag=chr(10).join([
                  "",
                  'ARCHIVAL_EXPECTED_PRIMARY_DESIGN = {k:dict(v) for k,v in EXPECTED_PRIMARY_DESIGN.items()}',
                  'OBSERVED_PRIMARY_DESIGN = {}',
                  'for _ct in TARGET_CLASSES:',
                  '    OBSERVED_PRIMARY_DESIGN[_ct] = {}',
                  '    for _model in ["primary","PMD_technical_sensitivity"]:',
                  '        _r = primary_design.loc[(primary_design["cell_type"]==_ct) & (primary_design["model"]==_model)].iloc[0]',
                  '        OBSERVED_PRIMARY_DESIGN[_ct][_model] = float(_r["standardized_condition_number"])',
                  'print("SENSITIVITY_DESIGN_CONDITION_NUMBERS", OBSERVED_PRIMARY_DESIGN, "ARCHIVAL_EXPECTED", ARCHIVAL_EXPECTED_PRIMARY_DESIGN)',
                  'EXPECTED_PRIMARY_DESIGN = {k:dict(v) for k,v in OBSERVED_PRIMARY_DESIGN.items()}',
                  "",
              ])
              src=src[:dpos]+design_diag+src[dpos:]

              old_target='''assert len(
              target_cells
          ) == 69005'''
              if old_target not in src:
                  raise RuntimeError("STEP27 archival target-cell count assertion not found")
              src=src.replace(
                  old_target,
                  'print("SENSITIVITY_TARGET_CELLS", len(target_cells), "ARCHIVAL_EXPECTED", 69005)',
                  1,
              )
              old_selected='assert expected_selected_cells == 69005'
              if old_selected not in src:
                  raise RuntimeError("STEP27 archival selected-cell count assertion not found")
              src=src.replace(
                  old_selected,
                  'print("SENSITIVITY_SELECTED_CELLS", expected_selected_cells, "ARCHIVAL_EXPECTED", 69005); assert expected_selected_cells == len(target_cells)',
                  1,
              )
              return src

          def patch_step28(src):
              old="exp={'Astro':0,'Micro':0,'OPC':0,'Oligo':4}; got=dict(zip(summary.cell_type,summary.primary_FDR)); assert got==exp,(got,exp)"
              if old not in src:
                  raise RuntimeError("STEP28 FDR assertion not found")
              new="exp={'Astro':0,'Micro':0,'OPC':0,'Oligo':4}; got=dict(zip(summary.cell_type,summary.primary_FDR)); print('SENSITIVITY_PRIMARY_FDR',got,'ARCHIVAL_EXPECTED',exp)"
              return src.replace(old,new,1)

          def exact_patch(src):
              start=src.index("sc.pp.neighbors(")
              end=src.index("\n\n\nsc.tl.leiden(",start)
              replacement=chr(10).join([
                  "from sklearn.neighbors import KNeighborsTransformer",
                  "",
                  "exact_transformer = KNeighborsTransformer(",
                  "    n_neighbors=N_NEIGHBORS,",
                  '    mode="distance",',
                  '    metric="euclidean",',
                  '    algorithm="brute",',
                  "    n_jobs=1,",
                  ")",
                  "",
                  "sc.pp.neighbors(",
                  "    adata_hvg,",
                  '    use_rep="X_harmony20",',
                  '    method="umap",',
                  "    transformer=exact_transformer,",
                  ")",
                  "",
              ])
              return src[:start]+replacement+src[end:]

          for variant in ["default","exact"]:
              cells=[]
              for marker in markers:
                  hits=[c for c in nb["cells"] if marker in "".join(c.get("source",[]))]
                  if len(hits)!=1:
                      raise RuntimeError(f"{marker}: expected one cell, found {len(hits)}")
                  cell=dict(hits[0])
                  src="".join(cell["source"])
                  if marker=="RETINA-ND — STEP 26A1" and variant=="exact":
                      src=exact_patch(src)
                  if marker=="RETINA-ND — STEP 26B":
                      src=diagnostic_patch_26b(src)
                  if marker=="RETINA-ND — STEP 27 — CORRECTED":
                      src=patch_step27(src)
                  if marker=="V2 STEP 28 — GSE157827 PRIMARY + PMD REPLICATION DE":
                      src=patch_step28(src)
                  cell["source"]=src.splitlines(keepends=True)
                  cell["outputs"]=[]
                  cell["execution_count"]=None
                  cells.append(cell)
              mini={
                  "cells":cells,
                  "metadata":nb.get("metadata",{}),
                  "nbformat":nb["nbformat"],
                  "nbformat_minor":nb["nbformat_minor"],
              }
              out=Path(f"/tmp/GSE157827_{variant}_DONOR_EFFECT.ipynb")
              out.write_text(json.dumps(mini))
              print("BUILT",variant,out,len(cells))
          PY

      - name: Run default-neighbor variant
        env:
          RETINA_ND_ROOT: /tmp/gse157827_default
        run: |
          set -o pipefail
          rm -rf "$RETINA_ND_ROOT"
          mkdir -p "$RETINA_ND_ROOT/locks"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RETINA_ND_ROOT"])
          locks=root/"locks"
          (locks/"AD_BRAIN_DATASET_ROLES_v1.json").write_text(json.dumps({
            "status":"AD_DATASET_ROLES_FROZEN_BEFORE_DISEASE_EXPRESSION",
            "primary_replication":{"dataset":"GSE157827"},
            "primary_discovery":{"dataset":"GSE174367"}
          },indent=2))
          (locks/"GSE174367_AD_DISCOVERY_FINAL_ROBUSTNESS_FREEZE_v1.json").write_text(json.dumps({
            "status":"AD_DISCOVERY_FINAL_ROBUSTNESS_FROZEN",
            "AD_replication_performed":False,
            "AD_PD_convergence_performed":False
          },indent=2))
          PY
          jupyter nbconvert --to notebook --execute /tmp/GSE157827_default_DONOR_EFFECT.ipynb \
            --output /tmp/GSE157827_default_DONOR_EFFECT_EXECUTED.ipynb \
            --ExecutePreprocessor.timeout=9000 2>&1 | tee /tmp/default.log

      - name: Run exact-neighbor variant
        env:
          RETINA_ND_ROOT: /tmp/gse157827_exact
        run: |
          set -o pipefail
          rm -rf "$RETINA_ND_ROOT"
          mkdir -p "$RETINA_ND_ROOT/locks"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RETINA_ND_ROOT"])
          locks=root/"locks"
          (locks/"AD_BRAIN_DATASET_ROLES_v1.json").write_text(json.dumps({
            "status":"AD_DATASET_ROLES_FROZEN_BEFORE_DISEASE_EXPRESSION",
            "primary_replication":{"dataset":"GSE157827"},
            "primary_discovery":{"dataset":"GSE174367"}
          },indent=2))
          (locks/"GSE174367_AD_DISCOVERY_FINAL_ROBUSTNESS_FREEZE_v1.json").write_text(json.dumps({
            "status":"AD_DISCOVERY_FINAL_ROBUSTNESS_FROZEN",
            "AD_replication_performed":False,
            "AD_PD_convergence_performed":False
          },indent=2))
          PY
          jupyter nbconvert --to notebook --execute /tmp/GSE157827_exact_DONOR_EFFECT.ipynb \
            --output /tmp/GSE157827_exact_DONOR_EFFECT_EXECUTED.ipynb \
            --ExecutePreprocessor.timeout=9000 2>&1 | tee /tmp/exact.log

      - name: Compare donor-level effects
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd
          from scipy.stats import spearmanr, pearsonr

          roots={"default":Path("/tmp/gse157827_default"),"exact":Path("/tmp/gse157827_exact")}
          classes=["Astro","Micro","OPC","Oligo"]

          def one(root,name):
              hits=list(root.rglob(name))
              if len(hits)!=1:
                  raise RuntimeError(f"{root}: {name}: {hits}")
              return hits[0]

          effects={}
          summaries={}
          counts={}
          for variant,root in roots.items():
              ep=one(root,"GSE157827_AD_REPLICATION_PRIMARY_ALL_EFFECTS_LONG_v1.csv.gz")
              sp=one(root,"GSE157827_AD_REPLICATION_PRIMARY_AND_PMD_SUMMARY_v1.csv")
              cp=one(root,"GSE157827_FINAL_TARGET_CELL_COUNTS_v1.csv")
              effects[variant]=pd.read_csv(ep,compression="gzip",low_memory=False)
              summaries[variant]=pd.read_csv(sp)
              counts[variant]=pd.read_csv(cp)

          rows=[]
          for ct in classes:
              a=effects["default"].loc[effects["default"].cell_type==ct].copy()
              b=effects["exact"].loc[effects["exact"].cell_type==ct].copy()
              m=a.merge(b,on="gene_id",suffixes=("_default","_exact"))
              l1=pd.to_numeric(m["log2FoldChange_default"],errors="coerce").to_numpy(float)
              l2=pd.to_numeric(m["log2FoldChange_exact"],errors="coerce").to_numpy(float)
              w1=pd.to_numeric(m["stat_default"],errors="coerce").to_numpy(float)
              w2=pd.to_numeric(m["stat_exact"],errors="coerce").to_numpy(float)
              mask=np.isfinite(l1)&np.isfinite(l2)
              wmask=np.isfinite(w1)&np.isfinite(w2)
              sign=float(np.mean(np.sign(l1[mask])==np.sign(l2[mask])))
              absmax=np.maximum(np.abs(l1[mask]),np.abs(l2[mask]))
              cutoff=np.quantile(absmax,0.95)
              top=absmax>=cutoff
              top_sign=float(np.mean(np.sign(l1[mask][top])==np.sign(l2[mask][top])))
              sd=summaries["default"].set_index("cell_type").loc[ct]
              se=summaries["exact"].set_index("cell_type").loc[ct]
              rows.append({
                  "cell_type":ct,
                  "n_overlap_genes":int(mask.sum()),
                  "lfc_spearman":float(spearmanr(l1[mask],l2[mask]).statistic),
                  "lfc_pearson":float(pearsonr(l1[mask],l2[mask]).statistic),
                  "wald_spearman":float(spearmanr(w1[wmask],w2[wmask]).statistic),
                  "sign_agreement":sign,
                  "top5pct_abs_lfc_sign_agreement":top_sign,
                  "default_n_donors":int(sd.n_donors),
                  "exact_n_donors":int(se.n_donors),
                  "default_primary_FDR":int(sd.primary_FDR),
                  "exact_primary_FDR":int(se.primary_FDR),
                  "default_PMD_FDR":int(sd.PMD_FDR),
                  "exact_PMD_FDR":int(se.PMD_FDR),
                  "default_tested_genes":int(sd.tested_genes),
                  "exact_tested_genes":int(se.tested_genes),
              })

          comp=pd.DataFrame(rows)
          count_comp=counts["default"].merge(counts["exact"],on="cell_type",suffixes=("_default","_exact"))
          result={
              "effect_comparison":comp.to_dict("records"),
              "cell_count_comparison":count_comp.to_dict("records"),
              "archival_primary_FDR_expected":{"Astro":0,"Micro":0,"OPC":0,"Oligo":4},
          }
          print("DONOR_EFFECT_ROBUSTNESS_RESULT",json.dumps(result,indent=2))
          Path("/tmp/donor_effect_robustness.json").write_text(json.dumps(result,indent=2))
          comp.to_csv("/tmp/donor_effect_robustness.csv",index=False)
          count_comp.to_csv("/tmp/cell_count_robustness.csv",index=False)
          PY

      - name: Compare AD discovery-to-replication robustness
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd
          from scipy.stats import spearmanr, binomtest

          disc_hits=list(Path("/tmp/reference").rglob("GSE174367_AD_DISCOVERY_ALL_EFFECTS_LONG_v1.csv.gz"))
          if len(disc_hits)!=1:
              raise RuntimeError(f"Expected one frozen discovery table, found {disc_hits}")
          D=pd.read_csv(disc_hits[0],compression="gzip",low_memory=False).rename(columns={
              "AD_vs_Control_log2FC":"log2FoldChange",
              "AD_vs_Control_Wald":"stat",
              "AD_vs_Control_pvalue":"pvalue",
              "AD_vs_Control_padj":"padj",
          })
          roots={"default":Path("/tmp/gse157827_default"),"exact":Path("/tmp/gse157827_exact")}
          classes=["Astro","Micro","OPC","Oligo"]

          def one(root,name):
              hits=list(root.rglob(name))
              if len(hits)!=1:
                  raise RuntimeError(f"{root}: {name}: {hits}")
              return hits[0]

          def unique_symbols(x):
              x=x.copy()
              x["gene_symbol"]=x["gene_symbol"].astype(str).str.upper().str.strip()
              return x.loc[~x["gene_symbol"].duplicated(keep=False)].copy()

          def perm_positive(x,y,seed,n=10000):
              mask=np.isfinite(x)&np.isfinite(y)
              x=np.asarray(x)[mask]; y=np.asarray(y)[mask]
              obs=float(spearmanr(x,y).statistic)
              rng=np.random.default_rng(seed)
              ge=0
              for _ in range(n):
                  p=float(spearmanr(x,rng.permutation(y)).statistic)
                  if np.isfinite(p) and p>=obs: ge+=1
              return obs,float((ge+1)/(n+1)),int(len(x))

          rows=[]
          for vix,(variant,root) in enumerate(roots.items()):
              R=pd.read_csv(one(root,"GSE157827_AD_REPLICATION_PRIMARY_ALL_EFFECTS_LONG_v1.csv.gz"),compression="gzip",low_memory=False)
              for cix,ct in enumerate(classes):
                  d=unique_symbols(D.loc[D.cell_type.astype(str)==ct])
                  r=unique_symbols(R.loc[R.cell_type.astype(str)==ct])
                  m=d[["gene_symbol","log2FoldChange","stat","pvalue","padj"]].rename(columns={
                      "log2FoldChange":"lfc_disc","stat":"wald_disc","pvalue":"p_disc","padj":"padj_disc"
                  }).merge(
                      r[["gene_symbol","log2FoldChange","stat","pvalue","padj"]].rename(columns={
                          "log2FoldChange":"lfc_rep","stat":"wald_rep","pvalue":"p_rep","padj":"padj_rep"
                      }),
                      on="gene_symbol",how="inner",validate="one_to_one"
                  )
                  lfc_rho,lfc_p,n_lfc=perm_positive(
                      pd.to_numeric(m.lfc_disc,errors="coerce").to_numpy(float),
                      pd.to_numeric(m.lfc_rep,errors="coerce").to_numpy(float),
                      20260914+cix,
                  )
                  wald_rho,wald_p,n_wald=perm_positive(
                      pd.to_numeric(m.wald_disc,errors="coerce").to_numpy(float),
                      pd.to_numeric(m.wald_rep,errors="coerce").to_numpy(float),
                      20261914+cix,
                  )
                  dl=pd.to_numeric(m.lfc_disc,errors="coerce").to_numpy(float)
                  rl=pd.to_numeric(m.lfc_rep,errors="coerce").to_numpy(float)
                  finite=np.isfinite(dl)&np.isfinite(rl)
                  direction=float(np.mean(np.sign(dl[finite])==np.sign(rl[finite])))
                  pdadj=pd.to_numeric(m.padj_disc,errors="coerce").to_numpy(float)
                  rp=pd.to_numeric(m.p_rep,errors="coerce").to_numpy(float)
                  hits=np.isfinite(pdadj)&(pdadj<0.05)&finite
                  n_hits=int(hits.sum())
                  same=int((np.sign(dl[hits])==np.sign(rl[hits])).sum()) if n_hits else 0
                  success=int(((np.sign(dl[hits])==np.sign(rl[hits])) & np.isfinite(rp[hits]) & (rp[hits]<0.05)).sum()) if n_hits else 0
                  binom_p=float(binomtest(same,n_hits,p=.5,alternative="greater").pvalue) if n_hits else None
                  rows.append({
                      "variant":variant,"cell_type":ct,"matched_unique_genes":int(len(m)),
                      "LFC_spearman":lfc_rho,"LFC_perm_p":lfc_p,"finite_LFC_pairs":n_lfc,
                      "Wald_spearman":wald_rho,"Wald_perm_p":wald_p,"finite_Wald_pairs":n_wald,
                      "all_gene_direction_concordance":direction,
                      "discovery_FDR_measurable":n_hits,"same_direction_hits":same,
                      "gene_level_replication_success":success,"direction_binomial_p":binom_p,
                  })

          out=pd.DataFrame(rows)
          print("AD_REPLICATION_CLUSTERING_SENSITIVITY",json.dumps(out.to_dict("records"),indent=2))
          Path("/tmp/ad_replication_clustering_sensitivity.json").write_text(json.dumps(out.to_dict("records"),indent=2))
          out.to_csv("/tmp/ad_replication_clustering_sensitivity.csv",index=False)
          PY

      - name: Upload aggregate robustness outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse157827-donor-effect-clustering-robustness
          path: |
            /tmp/donor_effect_robustness.json
            /tmp/donor_effect_robustness.csv
            /tmp/cell_count_robustness.csv
            /tmp/ad_replication_clustering_sensitivity.json
            /tmp/ad_replication_clustering_sensitivity.csv
            /tmp/default.log
            /tmp/exact.log
          retention-days: 7
