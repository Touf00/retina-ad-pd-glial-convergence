name: ChatGPT GSE157827 endothelial feasibility

on:
  push:
    branches: [chatgpt-repro-audit]
    paths:
      - ".github/workflows/chatgpt-gse157827-endo-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas openpyxl requests
      - name: Audit author endothelial coverage
        run: |
          python - <<'PY'
          import requests,pandas as pd,json,hashlib
          from pathlib import Path
          out=Path("/tmp/gse157827_endo"); out.mkdir(exist_ok=True)
          url="https://pmc-oa-opendata.s3.amazonaws.com/PMC7568283.1/pnas.2008762117.sd01.xlsx"
          expected_sha256="a7cf9493b99e5cb904e8dcc764349a331fda701509ebbe5a9e1ad868b18bc344"
          p=out/"pnas.2008762117.sd01.xlsx"
          r=requests.get(url,timeout=(30,120),allow_redirects=True)
          print(url,r.status_code,r.headers.get("content-type"),len(r.content))
          r.raise_for_status()
          if len(r.content)<=10000 or r.content[:2]!=b"PK":
            raise RuntimeError("Official PMC object is not a valid XLSX payload")
          observed_sha256=hashlib.sha256(r.content).hexdigest()
          if observed_sha256!=expected_sha256:
            raise RuntimeError(f"Workbook SHA-256 mismatch: {observed_sha256}")
          p.write_bytes(r.content)
          pat=pd.read_excel(p,sheet_name="Patient_info",dtype=object)
          qc=pd.read_excel(p,sheet_name="snRNAseq_QC",dtype=object)
          pat.columns=[str(x).strip() for x in pat.columns]; qc.columns=[str(x).strip() for x in qc.columns]
          qc["ID"]=qc["ID"].astype(str).str.strip()
          pat["ID"]=pat["ID"].astype(str).str.strip()
          qc=qc[qc.ID.ne("Mean")].copy()
          # normalize conditions from source, do not infer beyond explicit labels
          merged=qc.merge(pat,on="ID",how="left",validate="one_to_one")
          for c in ["Number of nucleus","Proportion of Endo (%)"]:
            merged[c]=pd.to_numeric(merged[c],errors="coerce")
          merged["estimated_author_endo_nuclei"]=merged["Number of nucleus"]*merged["Proportion of Endo (%)"]/100.0
          merged.to_csv(out/"GSE157827_author_endothelial_coverage.csv",index=False)
          condcol="CONDITION" if "CONDITION" in merged else None
          print("columns",merged.columns.tolist())
          print(merged[["ID"]+([condcol] if condcol else [])+["Number of nucleus","Proportion of Endo (%)","estimated_author_endo_nuclei"]].to_string(index=False))
          summary={
            "n_donors":int(len(merged)),
            "source_url":url,
            "workbook_sha256":observed_sha256,
          }
          if condcol:
            for dx,g in merged.groupby(condcol):
              vals=g.estimated_author_endo_nuclei
              summary[str(dx)]={
                "n_donors":int(len(g)),
                "estimated_total":float(vals.sum()),
                "n_est_ge5":int((vals>=5).sum()),
                "n_est_ge10":int((vals>=10).sum()),
                "n_est_ge20":int((vals>=20).sum()),
                "n_est_ge50":int((vals>=50).sum()),
                "median_est_n":float(vals.median()),
                "min_est_n":float(vals.min()),
                "max_est_n":float(vals.max())
              }
          summary["pericyte_annotation_available_in_author_QC"]=False
          (out/"summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gse157827-endothelial-feasibility
          path: /tmp/gse157827_endo/
          retention-days: 7

