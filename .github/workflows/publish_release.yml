name: Publish v1.0.0 release

on:
  push:
    paths:
      - ".release/READY"

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "2f413ec4e526ccaf47549a407520917502c52706" \
            --title "RETINA-ND code release v1.0.0" \
            --notes "Archival code release accompanying the manuscript 'Glial transcriptomic convergence in Alzheimer’s and Parkinson’s disease with independent retinal and aqueous-humor evidence'. This release provides the analysis notebooks, reproducibility helpers, dependency record, citation metadata, and release manifest. No analysis notebook was re-executed for this archival publication."
