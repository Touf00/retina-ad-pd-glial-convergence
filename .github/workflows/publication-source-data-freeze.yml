name: Freeze publication source data

on:
  push:
    branches: [reproducibility-audit]
    paths:
      - ".github/workflows/publication-source-data-freeze.yml"

permissions:
  contents: write
  actions: read

jobs:
  freeze-source-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reproducibility-audit

      - name: Download cross-cohort matrix artifact
        uses: actions/download-artifact@v5
        with:
          name: glial-cross-cohort-matrix
          path: /tmp/matrix
          run-id: 36142383845
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download independent-pair bootstrap artifact
        uses: actions/download-artifact@v5
        with:
          name: external-pair-robustness
          path: /tmp/bootstrap
          run-id: 36135599890
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve exact source files
        run: |
          set -euo pipefail
          mkdir -p publication/source_data/cross_cohort_gene_effects
          mkdir -p publication/source_data/independent_pair_bootstrap

          cp /tmp/matrix/glial_matrix/glial_cross_cohort_matrix.csv publication/source_data/
          cp /tmp/matrix/glial_matrix/glial_cross_cohort_consistency_summary.csv publication/source_data/
          cp /tmp/matrix/glial_matrix/*.csv.gz publication/source_data/cross_cohort_gene_effects/

          cp /tmp/bootstrap/independent_pair_donor_bootstrap_summary.csv publication/source_data/
          cp /tmp/bootstrap/independent_AD_PD_pair_summary.csv publication/source_data/
          cp /tmp/bootstrap/bootstrap_*.csv publication/source_data/independent_pair_bootstrap/
          cp /tmp/bootstrap/independent_AD_PD_*_merged_effects.csv.gz publication/source_data/independent_pair_bootstrap/
          cp /tmp/bootstrap/summary.json publication/source_data/independent_pair_bootstrap/

      - name: Verify frozen publication values
        run: |
          python - <<'PY'
          import math
          import pandas as pd
          from pathlib import Path

          m=pd.read_csv("publication/source_data/glial_cross_cohort_matrix.csv")
          expected=[
            ("AD174","PD243","Astro",15423,0.18530066167957102,0.5779031316864424,9.999000099990002e-05),
            ("AD174","PD243","Micro",14975,0.054761237451223695,0.527212020033389,9.999000099990002e-05),
            ("AD174","PD243","OPC",14842,0.15165412797459368,0.5733054844360598,9.999000099990002e-05),
            ("AD174","PD243","Oligo",14241,0.2530899281631158,0.6069096271329261,9.999000099990002e-05),
            ("AD174","PD329","Astro",12766,-0.028955416722157203,0.4884850383832054,0.0015998400159984002),
            ("AD174","PD329","Micro",12849,0.0033416937780416014,0.4965366954626819,0.7096290370962903),
            ("AD174","PD329","OPC",12342,0.07589399854105901,0.5294927888510776,9.999000099990002e-05),
            ("AD174","PD329","Oligo",12158,0.045171550604864684,0.521385096232933,9.999000099990002e-05),
            ("AD222","PD243","Astro",9803,0.315615556964746,0.5899214526165459,9.999000099990002e-05),
            ("AD222","PD243","Micro",5131,0.12037195371820002,0.5527187682712922,9.999000099990002e-05),
            ("AD222","PD243","OPC",7475,0.21748352514728805,0.5689632107023411,9.999000099990002e-05),
            ("AD222","PD243","Oligo",11208,0.3908917679016623,0.6397216274089935,9.999000099990002e-05),
            ("AD222","PD329","Astro",8999,-0.08716009771586174,0.48105345038337594,9.999000099990002e-05),
            ("AD222","PD329","Micro",4931,0.04046927606697341,0.5179476779557899,0.0046995300469953),
            ("AD222","PD329","OPC",6969,-0.004365529840236528,0.5085378103027695,0.7228277172282772),
            ("AD222","PD329","Oligo",10045,-0.040129004480826944,0.48810353409656543,9.999000099990002e-05),
          ]
          assert len(m)==16
          for row,exp in zip(m.itertuples(index=False),expected):
              got=(row.AD_cohort,row.PD_cohort,row.cell_class,int(row.n_genes))
              assert got==exp[:4], (got,exp[:4])
              for a,b in zip((row.rho,row.sign_agreement,row.perm_p),exp[4:]):
                  assert math.isclose(float(a),float(b),rel_tol=0,abs_tol=1e-15),(a,b)

          b=pd.read_csv("publication/source_data/independent_pair_donor_bootstrap_summary.csv")
          bexp={
            "Astro":(500,-0.051399890809696466,-0.14764276187800637,0.059187648486425944,0.212),
            "Micro":(500,0.01678296978365404,-0.09765181889569001,0.1303706235977175,0.628),
            "OPC":(500,-0.0037152463226789063,-0.060804338743030054,0.05238584266305638,0.44),
            "Oligo":(500,-0.028477299294650642,-0.1457308627148808,0.08745500082747729,0.302),
          }
          assert set(b.cell_class)==set(bexp)
          for r in b.itertuples(index=False):
              exp=bexp[r.cell_class]
              assert int(r.B)==exp[0]
              for a,z in zip((r.median_rho,r.ci2_5,r.ci97_5,r.fraction_rho_gt0),exp[1:]):
                  assert math.isclose(float(a),float(z),rel_tol=0,abs_tol=1e-15),(r.cell_class,a,z)

          draws=list(Path("publication/source_data/independent_pair_bootstrap").glob("bootstrap_*.csv"))
          effects=list(Path("publication/source_data/cross_cohort_gene_effects").glob("*.csv.gz"))
          assert len(draws)==4, draws
          assert len(effects)==16, effects
          for p in draws:
              d=pd.read_csv(p)
              assert len(d)==500,(p,len(d))
          print("SOURCE_DATA_FREEZE_VERIFIED",len(m),"matrix rows",len(draws),"bootstrap draw files",len(effects),"gene-effect files")
          PY

      - name: Write provenance and checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root=Path("publication/source_data")
          files=sorted(p for p in root.rglob("*") if p.is_file() and p.name!="SHA256SUMS.txt")
          lines=[]
          for p in files:
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              lines.append(f"{h}  {p.relative_to(root).as_posix()}")
          (root/"SHA256SUMS.txt").write_text("\n".join(lines)+"\n")

          readme="\\n".join([
              "# Publication source data",
              "",
              "These files are durable copies of the exact outputs used for the publication-facing cross-cohort glial matrix and independent-pair donor-bootstrap robustness analysis.",
              "",
              "## Provenance",
              "",
              "- 2 x 2 AD-PD glial matrix: workflow run 36142383845, artifact 10868790506, artifact digest sha256:b8f249d4b2ce8fd306d053cb1bb2cbbe469bf817721b5e109093f23a9fc109a7.",
              "- Independent GSE222494 x GSE329625 donor bootstrap: workflow run 36135599890, artifact 10863442549, artifact digest sha256:d848e3e0390742999cf74f67c79608658c708f90a2c6f8a6d3cae980eb8ddf77.",
              "",
              "The 16-row matrix and four bootstrap summaries were verified numerically against PUBLICATION_RESULT_FREEZE_v1.md before commit. No frozen publication value mismatched.",
              "",
              "The independent-pair pair-summary permutation P values come from its own permutation realization and are not substituted for the corresponding values in the separately executed 2 x 2 matrix table. Bootstrap confidence intervals use B=500 donor-resampling iterations per cell class.",
              "",
              "The compressed gene-effect tables and all 500 bootstrap draws per cell class are retained here so publication figures and source-data tables no longer depend on expiring workflow artifacts.",
              "",
          ])
          (root/"README.md").write_text(readme)
          PY

      - name: Commit durable publication source data
        run: |
          set -euo pipefail
          git config user.name "publication-data-freeze"
          git config user.email "actions@users.noreply.github.com"
          git add publication/source_data
          if git diff --cached --quiet; then
            echo "No source-data changes to commit."
          else
            git commit -m "Freeze cross-cohort and bootstrap publication source data"
            git push origin HEAD:reproducibility-audit
          fi
