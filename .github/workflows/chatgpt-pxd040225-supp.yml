name: ChatGPT PXD040225 supplement parse

on:
  push:
    branches: [chatgpt-repro-audit]
    paths:
      - ".github/workflows/chatgpt-pxd040225-supp.yml"

permissions:
  contents: read
  actions: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pypdf pdfplumber pandas
      - name: Parse supplement
        run: |
          python - <<'PY'
          import requests,re,json
          from pathlib import Path
          import pypdf
          out=Path("/tmp/pxd040_supp"); out.mkdir(exist_ok=True)
          url="https://media.springernature.com/original/springer-static/esm/art%3A10.1007%2Fs00401-023-02548-2/MediaObjects/401_2023_2548_MOESM1_ESM.pdf"
          p=out/"supplement.pdf"
          r=requests.get(url,timeout=180); r.raise_for_status(); p.write_bytes(r.content)
          reader=pypdf.PdfReader(str(p))
          hits=[]
          full=[]
          for i,page in enumerate(reader.pages):
            t=page.extract_text() or ""
            full.append(f"\n=== PAGE {i+1} ===\n{t}")
            tl=t.lower()
            if any(k in tl for k in ["table s4","table 4","retina proteom","fold change","protein accession","proteome"]):
              hits.append({"page":i+1,"preview":t[:6000]})
          (out/"supplement_text.txt").write_text("\n".join(full),errors="ignore")
          (out/"hit_pages.json").write_text(json.dumps(hits,indent=2))
          print("pages",len(reader.pages),"hits",len(hits))
          for h in hits[:30]:
            print("\n### PAGE",h["page"],"\n",h["preview"][:4000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pxd040225-supplement-parse
          path: /tmp/pxd040_supp/
          retention-days: 7
