name: ChatGPT PXD040225 source-data audit

on:
  push:
    branches: [chatgpt-repro-audit]
    paths:
      - ".github/workflows/chatgpt-pxd040225.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pandas openpyxl requests numpy
      - name: Inspect and extract retinal proteomics source data
        shell: bash
        run: |
          cat > /tmp/a.py <<'PY'
          import requests,pandas as pd,numpy as np,json,re
          from pathlib import Path
          OUT=Path("/tmp/pxd040225"); OUT.mkdir(exist_ok=True)
          url="https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-026-68580-4/MediaObjects/41467_2026_68580_MOESM4_ESM.xlsx"
          p=OUT/"41467_2026_68580_MOESM4_ESM.xlsx"
          r=requests.get(url,timeout=180); r.raise_for_status(); p.write_bytes(r.content)
          xls=pd.ExcelFile(p)
          rep={"bytes":p.stat().st_size,"sheets":xls.sheet_names,"sheet_info":[]}
          for sh in xls.sheet_names:
            df=pd.read_excel(p,sheet_name=sh)
            info={"sheet":sh,"shape":list(df.shape),"columns":[str(x) for x in df.columns],
                  "head":df.head(3).astype(str).to_dict("records")}
            rep["sheet_info"].append(info)
            # Export sheets with protein/gene/fold-change/stat fields.
            cols=" ".join(map(str,df.columns)).lower()
            if any(k in cols for k in ["protein","gene","fold","log2","p value","p-value","abundance"]):
              safe=re.sub(r"[^A-Za-z0-9_.-]+","_",str(sh))
              df.to_csv(OUT/f"sheet_{safe}.csv.gz",index=False,compression="gzip")
          (OUT/"audit.json").write_text(json.dumps(rep,indent=2))
          print(json.dumps(rep,indent=2)[:50000])
          PY
          python /tmp/a.py | tee /tmp/pxd040225.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pxd040225-source-data
          path: |
            /tmp/pxd040225/
            /tmp/pxd040225.log
          retention-days: 7
