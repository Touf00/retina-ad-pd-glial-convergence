name: ChatGPT matrix format probe

on:
  push:
    branches: [chatgpt-repro-audit]
    paths:
      - ".github/workflows/chatgpt-matrix-probe.yml"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe deps
        run: python -m pip install requests
      - name: Probe matrices
        run: |
          python - <<'PY'
          import requests,gzip,io,json
          urls={
            "GSE329625":"https://ftp.ncbi.nlm.nih.gov/geo/series/GSE329nnn/GSE329625/suppl/GSE329625_processed_gene_matrix.txt.gz",
            "GSE222494":"https://ftp.ncbi.nlm.nih.gov/geo/series/GSE222nnn/GSE222494/suppl/GSE222494_BrainFRONTAL_counts.csv.gz",
            "GSE243639":"https://ftp.ncbi.nlm.nih.gov/geo/series/GSE243nnn/GSE243639/suppl/GSE243639_Filtered_count_table.csv.gz",
          }
          out={}
          for k,u in urls.items():
            h=requests.head(u,allow_redirects=True,timeout=60)
            r=requests.get(u,stream=True,timeout=180)
            r.raise_for_status()
            gz=gzip.GzipFile(fileobj=r.raw)
            t=io.TextIOWrapper(gz,encoding="utf-8",errors="replace")
            lines=[]
            for _ in range(3):
              lines.append(next(t).rstrip("\n")[:12000])
            out[k]={"content_length":h.headers.get("content-length"),"content_type":h.headers.get("content-type"),"first_lines":lines}
          print(json.dumps(out,indent=2))
          open("/tmp/matrix_probe.json","w").write(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-probe
          path: /tmp/matrix_probe.json
          retention-days: 7
