name: ChatGPT GSE157827 Endo cluster audit

on:
  push:
    branches: [chatgpt-repro-audit]
    paths:
      - ".github/workflows/chatgpt-gse157827-endo-cluster-audit.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - name: Download prior clean-run audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10864609217/zip" -o /tmp/a.zip
          unzip -q /tmp/a.zip -d /tmp/a
          find /tmp/a -type f -maxdepth 3 -print
      - name: Inspect Endo candidate clusters
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, json
          hits=list(Path("/tmp/a").rglob("GSE157827_DISEASE_BLIND_CLUSTER_MARKER_SCORES_PROVISIONAL_v1.csv"))
          if len(hits)!=1: raise RuntimeError(hits)
          x=pd.read_csv(hits[0])
          print("COLUMNS",x.columns.tolist())
          print("SHAPE",x.shape)
          print(x.to_string(index=False))
          lab=[c for c in x.columns if "broad_label" in c.lower() or "candidate" in c.lower()]
          endo=x[x.apply(lambda r:r.astype(str).str.contains("Endo",case=False,regex=False).any(),axis=1)].copy()
          out=Path("/tmp/endo_cluster_audit"); out.mkdir()
          x.to_csv(out/"all_cluster_scores.csv",index=False)
          endo.to_csv(out/"endo_rows.csv",index=False)
          summary={"columns":x.columns.tolist(),"n_clusters":len(x),"endo_rows":endo.to_dict("records")}
          (out/"summary.json").write_text(json.dumps(summary,indent=2,default=str))
          print("SUMMARY",json.dumps(summary,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gse157827-endo-cluster-audit
          path: /tmp/endo_cluster_audit/
          retention-days: 7
